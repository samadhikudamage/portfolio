    <!-- Load Scripts Start -->

    <script>
      // GSAP Scroll Animations - Faster and Smoother
      gsap.registerPlugin(ScrollTrigger);

      // Add project page class to keep normal header positioning
      document.body.classList.add('project-page');

      // Initialize imagesLoaded to handle page loading properly
      const content = document.querySelector('body');
      const imgLoad = imagesLoaded(content);

      imgLoad.on('done', instance => {
        // Hide loader when images are loaded
        document.getElementById("loaderContent").classList.add("fade-out");
        setTimeout(() => {
          document.getElementById("loader").classList.add("loaded");
        }, 300);

        // Faster animation settings
        gsap.set('.animate-in-up', {y: 20, opacity: 0});

        ScrollTrigger.batch('.animate-in-up', {
          onEnter: batch => gsap.to(batch, {
            opacity: 1, 
            y: 0, 
            duration: 0.4,
            ease: 'power2.out',
            stagger: 0.05, 
            overwrite: true
          }),
          onLeaveBack: batch => gsap.set(batch, {opacity: 0, y: 20, overwrite: true})
        });

        ScrollTrigger.batch('.animate-card-2', {
          onEnter: batch => gsap.to(batch, {
            opacity: 1, 
            y: 0, 
            duration: 0.4,
            ease: 'power2.out',
            stagger: 0.08, 
            overwrite: true
          }),
          onLeaveBack: batch => gsap.set(batch, {opacity: 0, y: 20, overwrite: true})
        });

        // Force full-width layout for project pages
        document.addEventListener('DOMContentLoaded', function() {
          const contentElement = document.getElementById('content');
          if (contentElement) {
            contentElement.classList.add('full-width');
            contentElement.style.marginLeft = '0';
            contentElement.style.paddingLeft = '0';
            contentElement.style.width = '100%';
          }
          
          // Disable any avatar-related JavaScript
          const avatar = document.getElementById('avatar');
          if (!avatar) {
            // If no avatar exists, ensure content is full width
            if (contentElement) {
              contentElement.style.marginLeft = '0 !important';
              contentElement.style.paddingLeft = '0 !important';
            }
          }
        });

        // Refresh ScrollTrigger after all animations are set up
        ScrollTrigger.refresh();
      });
    </script>
